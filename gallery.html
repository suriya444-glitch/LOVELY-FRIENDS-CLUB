<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Lovely Friends Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonYellow: '#ffea00',
                        neonGreen: '#39ff14',
                        charcoal: '#121212',
                        cardBlack: '#1e1e1e'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-charcoal text-white min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-neonYellow flex items-center justify-center text-charcoal font-bebas text-2xl">LFC</div>
            <h1 class="text-2xl font-bebas tracking-wide text-white">LOVELY FRIENDS</h1>
        </div>
        <div class="hidden md:flex gap-8 font-inter font-semibold text-sm">
            <a href="index.html" class="nav-link text-gray-300 hover:text-white">HOME</a>
            <a href="stats.html" class="nav-link text-gray-300 hover:text-white">MATCH STATS</a>
            <a href="gallery.html" class="nav-link active">GALLERY</a>
            <a href="squad.html" class="nav-link text-gray-300 hover:text-white">SQUAD & INFO</a>
        </div>
    </nav>

    <main class="flex-grow px-4 md:px-10 py-12 max-w-7xl mx-auto w-full fade-in">
        
        <header class="mb-10 text-center md:text-left border-b border-gray-800 pb-6">
            <h2 class="font-bebas text-5xl md:text-7xl text-white mb-2">TEAM <span class="text-neonGreen">MEMORIES</span></h2>
            <p class="font-inter text-gray-400">Upload and share the best moments from our matches.</p>
        </header>

        <!-- Upload Section -->
        <div class="glass-card p-6 md:p-8 rounded-xl border border-gray-800 mb-12 flex flex-col md:flex-row gap-8 items-center">
            
            <div class="w-full md:w-1/2">
                <h3 class="font-bebas text-3xl mb-4 text-neonYellow">Add New Photo</h3>
                <form id="upload-form" class="space-y-4">
                    <div>
                        <input type="text" id="uploader-name" required placeholder="Uploader / Player Name" class="w-full bg-gray-900 bg-opacity-50 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-neonYellow transition font-inter text-sm">
                    </div>
                    <div>
                        <input type="text" id="photo-caption" required placeholder="Photo Caption" class="w-full bg-gray-900 bg-opacity-50 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-neonYellow transition font-inter text-sm">
                    </div>
                    <div class="relative">
                        <input type="password" id="upload-password" required placeholder="Upload Password" class="w-full bg-gray-900 bg-opacity-50 border border-gray-700 rounded px-4 py-3 pr-12 text-white focus:outline-none focus:border-neonYellow transition font-inter text-sm">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white focus:outline-none">
                            <svg id="eye-icon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg id="eye-slash-icon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                    <div class="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:border-neonGreen transition cursor-pointer relative" id="drop-zone">
                        <span class="text-gray-400 font-inter text-sm" id="file-name-display">Drag & Drop image here, or click to select</span>
                        <input type="file" id="photo-file" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <button type="submit" class="w-full bg-neonGreen text-charcoal font-bebas text-xl py-3 rounded hover:bg-green-400 transition transform hover:shadow-[0_0_15px_#39ff14]">
                        UPLOAD MEMORY
                    </button>
                </form>
            </div>
            
            <div class="w-full md:w-1/2 flex justify-center text-center">
                <div class="p-8">
                    <svg class="w-24 h-24 mx-auto text-gray-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p class="font-inter text-gray-400 text-sm">Photos are stored locally on your browser.</p>
                </div>
            </div>
            
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6">
            <!-- JS populated -->
        </div>

    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-black bg-opacity-95 hidden flex flex-col justify-center items-center opacity-0 transition-opacity duration-300">
        <button id="close-lightbox" class="absolute top-6 right-6 text-white hover:text-neonYellow transition p-2">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img id="lightbox-img" src="" alt="Full size" class="max-w-[90%] max-h-[80vh] object-contain rounded border border-gray-800 shadow-2xl">
        <div class="mt-6 text-center max-w-lg">
            <h4 id="lightbox-caption" class="font-bebas text-3xl text-white mb-1"></h4>
            <p id="lightbox-uploader" class="font-inter text-gray-400 text-sm mb-4"></p>
            <button id="delete-btn" class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white font-inter text-xs px-4 py-2 rounded transition">
                Remove Photo
            </button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('photo-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const form = document.getElementById('upload-form');
        const galleryGrid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxUploader = document.getElementById('lightbox-uploader');
        const closeLightboxBtn = document.getElementById('close-lightbox');
        const deleteBtn = document.getElementById('delete-btn');
        let currentPhotoId = null;

        // Default placeholder image
        const defaultPhotos = [
            {
                id: 'default-1',
                data: 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                caption: 'Victory Celebration 2025',
                uploader: 'Club Admin'
            },
            {
                id: 'default-2',
                data: 'https://images.unsplash.com/photo-1593341646782-e0b495cff86d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                caption: 'Volleyball Final Match',
                uploader: 'Ramesh'
            }
        ];

        // Init
        let photos = JSON.parse(localStorage.getItem('lfc_photos')) || defaultPhotos;
        renderGallery();

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = fileInput.files[0].name;
                fileNameDisplay.classList.add('text-neonGreen');
            } else {
                fileNameDisplay.textContent = 'Drag & Drop image here, or click to select';
                fileNameDisplay.classList.remove('text-neonGreen');
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const password = document.getElementById('upload-password').value;
            if (password !== 'NSPLFC') {
                alert('Incorrect Password!');
                return;
            }

            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const newPhoto = {
                    id: 'img_' + Date.now(),
                    data: event.target.result,
                    caption: document.getElementById('photo-caption').value,
                    uploader: document.getElementById('uploader-name').value
                };
                photos.unshift(newPhoto);
                saveAndRender();
                form.reset();
                fileNameDisplay.textContent = 'Drag & Drop image here, or click to select';
                fileNameDisplay.classList.remove('text-neonGreen');
            };
            reader.readAsDataURL(file);
        });

        function saveAndRender() {
            localStorage.setItem('lfc_photos', JSON.stringify(photos));
            renderGallery();
        }

        window.deletePhoto = function(id) {
            if(confirm('Are you sure you want to remove this photo?')) {
                const password = prompt('Enter password to delete this photo:');
                if (password === 'NSPLFC') {
                    photos = photos.filter(p => p.id !== id);
                    saveAndRender();
                    if (currentPhotoId === id) {
                        closeLightbox();
                    }
                } else if (password !== null) {
                    alert('Incorrect Password!');
                }
            }
        };

        function renderGallery() {
            galleryGrid.innerHTML = '';
            photos.forEach(photo => {
                const div = document.createElement('div');
                div.className = 'break-inside-avoid mb-6 relative group overflow-hidden rounded-xl border border-gray-800 cursor-pointer glass-card';
                div.onclick = () => openLightbox(photo);
                
                div.innerHTML = `
                    <img src="${photo.data}" alt="${photo.caption}" class="w-full object-cover transition transform duration-500 group-hover:scale-110">
                    <button class="absolute top-3 right-3 text-red-500 hover:text-red-400 bg-black bg-opacity-50 hover:bg-opacity-80 rounded-full p-2 opacity-0 group-hover:opacity-100 transition duration-300 z-10" onclick="event.stopPropagation(); deletePhoto('${photo.id}')" title="Delete Photo">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-4 pointer-events-none">
                        <h4 class="font-bebas text-xl text-white transform translate-y-4 group-hover:translate-y-0 transition duration-300">${photo.caption}</h4>
                        <p class="font-inter text-xs text-neonYellow transform translate-y-4 group-hover:translate-y-0 transition duration-300 delay-75">By ${photo.uploader}</p>
                    </div>
                `;
                galleryGrid.appendChild(div);
            });
        }

        function openLightbox(photo) {
            currentPhotoId = photo.id;
            lightboxImg.src = photo.data;
            lightboxCaption.textContent = photo.caption;
            lightboxUploader.textContent = `Uploaded by: ${photo.uploader}`;
            
            lightbox.classList.remove('hidden');
            // Trigger reflow
            void lightbox.offsetWidth;
            lightbox.classList.remove('opacity-0');
            lightbox.classList.add('opacity-100');
        }

        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden');
            }, 300);
        }

        closeLightboxBtn.onclick = closeLightbox;
        lightbox.onclick = (e) => {
            if(e.target === lightbox) closeLightbox();
        };

        deleteBtn.onclick = () => {
            deletePhoto(currentPhotoId);
        };

        const togglePasswordBtn = document.getElementById('toggle-password');
        const uploadPasswordInput = document.getElementById('upload-password');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeSlashIcon = document.getElementById('eye-slash-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = uploadPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            uploadPasswordInput.setAttribute('type', type);
            
            eyeIcon.classList.toggle('hidden');
            eyeSlashIcon.classList.toggle('hidden');
        });

    </script>
</body>
</html>
